<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图书管理系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 顶部导航 -->
  <div class="header">
    <span class="icon">📚</span> 图书管理系统
  </div>

  <!-- 主容器 -->
  <div class="container">
    <!-- 搜索栏 -->
    <div class="search-bar">
      <input type="text" id="keyword" placeholder="请输入图书名称搜索...">
      <button class="btn btn-primary" id="btnSearch">🔍 查询</button>
      <button class="btn btn-secondary" id="btnReset">↻ 重置</button>
      <a class="btn btn-success" href="add.html">＋ 新增图书</a>
    </div>

    <!-- 图书表格 -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>序号</th>
            <th>图书编号</th>
            <th>图书名称</th>
            <th>图书类型</th>
            <th>作者</th>
            <th>出版社</th>
            <th>入库时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="bookTbody">
          <tr class="empty-row"><td colspan="8">加载中...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- 分页 -->
    <div class="pagination" id="pagination"></div>
  </div>

  <script src="https://cdn.bootcdn.net/ajax/libs/jquery/1.8.3/jquery.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
